name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
          cache-dependency-path: android_app_project/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x android_app_project/gradlew

      - name: Test and build production debug APK
        working-directory: ./android_app_project
        run: ./gradlew --no-daemon --stacktrace testProductionDebugUnitTest assembleProductionDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: MBai-debug-apk
          path: android_app_project/app/build/outputs/apk/production/debug/app-production-debug.apk
          if-no-files-found: error
          retention-days: 30
