<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mBai Ai - Pixel Perfect UI Draft</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: #0d1215;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        /* 神经元背景图层 (分布在右侧和下侧) */
        .network-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0.15;
            background-image: url("data:image/svg+xml,%3Csvg width='400' height='400' xmlns='http://www.w3.org/2000/svg'%3E%3Cg stroke='%23ffffff' stroke-width='0.5' fill='none'%3E%3Cpath d='M300 0 L250 150 L400 200 L250 150 L100 250 L250 400 M100 250 L0 350 M250 150 L150 50' /%3E%3Ccircle cx='250' cy='150' r='1.5' fill='%23ffffff'/%3E%3Ccircle cx='100' cy='250' r='1.5' fill='%23ffffff'/%3E%3Ccircle cx='150' cy='50' r='1.5' fill='%23ffffff'/%3E%3C/g%3E%3C/svg%3E");
            background-repeat: repeat;
            z-index: 0;
        }

        /* 左上角巨型星球光晕 (Planet Orb) */
        .planet-orb {
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            top: -80px;
            left: -120px;
            background: rgba(20, 30, 25, 0.4);
            box-shadow: inset -10px -10px 40px rgba(180, 255, 100, 0.1),
                        inset -2px -2px 10px rgba(180, 255, 100, 0.3),
                        0 0 50px rgba(180, 255, 100, 0.1);
            border-bottom: 2px solid rgba(180, 255, 100, 0.4);
            border-right: 1px solid rgba(180, 255, 100, 0.2);
            z-index: 0;
        }
        /* 星球下方的一个高亮光斑 */
        .planet-glow {
            position: absolute;
            width: 80px;
            height: 40px;
            border-radius: 50%;
            top: 250px;
            left: 100px;
            background: #b4ff64;
            filter: blur(25px);
            opacity: 0.6;
            transform: rotate(-30deg);
            z-index: 0;
        }

        /* Mobile Screen Container */
        .mobile-container {
            position: relative;
            width: 390px;
            height: 844px;
            background: linear-gradient(180deg, rgba(20, 25, 30, 0.3) 0%, rgba(10, 15, 18, 0.7) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* 恢复居中以匹配紧凑布局 */
            padding: 0 32px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
            overflow: hidden;
        }

        /* Constellation Logo "M" (厚重的网格M) */
        .logo-container {
            width: 140px;
            height: 90px;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 15px rgba(100, 240, 255, 0.5));
        }

        /* mBai Ai 大标题，带有极强的高光青色发光 */
        .title {
            color: #d7fdff;
            font-size: 55px; /* 42px 放大 30% = ~55px */
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 60px; /* 稍微增加底部间距以平衡丢失的 logo 高度 */
            text-shadow: 0 0 20px rgba(100, 240, 255, 0.8), 0 0 40px rgba(100, 240, 255, 0.4);
            display: flex;
            align-items: center;
        }
        .title span {
            color: #d7fdff;
            margin-left: 8px;
        }

        /* Segmented Control (线框背景) */
        .segmented-control {
            display: flex;
            width: 100%;
            height: 54px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 27px;
            padding: 4px;
            margin-bottom: 30px;
            position: relative;
        }
        /* 选中的翠绿色实心背景指示器 */
        .segment-indicator {
            position: absolute;
            top: 4px;
            left: 4px;
            width: calc(50% - 4px);
            height: calc(100% - 8px);
            background: #0F9D58; /* 翠绿色 */
            border-radius: 23px;
            z-index: 1;
            transition: 0.3s ease;
        }
        .segment-btn {
            flex: 1;
            text-align: center;
            line-height: 44px;
            color: #999;
            font-weight: 500;
            font-size: 16px;
            cursor: pointer;
            position: relative;
            z-index: 2;
        }
        .segment-btn.active {
            color: #000; /* 选中时文字变黑 */
            font-weight: 600;
        }

        /* Glass Input Fields */
        .input-group {
            width: 100%;
            margin-bottom: 20px;
            position: relative;
        }
        .glass-input {
            width: 100%;
            height: 60px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 0 20px 0 54px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s ease;
        }

        /* 激活状态：霓虹高光外发光，使用 CSS :focus-within 自动处理交互 */
        .input-group:focus-within .glass-input {
            border: 2px solid #00E5FF;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.5), inset 0 0 10px rgba(0, 229, 255, 0.2);
            padding: 0 20px 0 53px; /* 补偿2px边框 */
        }
        .glass-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        /* 输入框内图标基础样式 */
        .icon-left {
            position: absolute;
            left: 20px;
            top: 18px;
            width: 20px;
            height: 20px;
            transition: 0.3s ease;
        }

        /* 默认状态颜色 */
        .icon-fill { fill: rgba(255,255,255,0.4); }
        .icon-stroke { stroke: rgba(255,255,255,0.4); fill: none; }

        /* 激活状态颜色 */
        .input-group:focus-within .icon-fill { fill: #00E5FF; }
        .input-group:focus-within .icon-stroke { stroke: #00E5FF; }

        /* 密码可见性小眼睛图标 */
        .icon-right {
            position: absolute;
            right: 20px;
            top: 20px;
            width: 20px;
            height: 20px;
            stroke: rgba(255,255,255,0.3);
            fill: none;
            cursor: pointer;
            transition: 0.3s ease;
        }
        .icon-right:hover {
            stroke: #fff;
        }

        /* Glowing Gradient Login Button (马卡龙黄绿色) */
        .login-btn {
            width: 100%;
            height: 64px;
            margin-top: 24px;
            background: linear-gradient(90deg, #c4fa66 0%, #80f2ad 100%);
            border: none;
            border-radius: 32px;
            color: #000;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(180, 250, 102, 0.5);
            transition: 0.3s ease;
        }
        .login-btn:hover {
            box-shadow: 0 20px 45px rgba(180, 250, 102, 0.7);
            transform: translateY(-2px);
        }

        /* 发送验证码按钮 */
        .send-code-btn {
            position: absolute;
            right: 8px;
            top: 10px;
            height: 40px;
            padding: 0 16px;
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid rgba(0, 229, 255, 0.5);
            border-radius: 20px;
            color: #00E5FF;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
            z-index: 2;
        }
        .send-code-btn:hover {
            background: rgba(0, 229, 255, 0.3);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
        }


        /* Toast Notifications */
        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        .toast {
            background: rgba(10, 20, 25, 0.9);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 8px;
            padding: 12px 24px;
            color: #fff;
            font-size: 14px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            animation: slideDown 0.3s ease forwards;
            opacity: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast.error {
            border-color: rgba(255, 80, 80, 0.5);
            box-shadow: 0 4px 15px rgba(255, 80, 80, 0.2);
        }
        .toast.error svg { stroke: #ff5050; }
        .toast.success svg { stroke: #00E5FF; }
        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(-10px); }
        }

        /* Forget Password */
        .forget-link-container {
            margin-top: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
        }
        .forget-link-container span {
            color: #ccc;
            font-size: 14px;
            font-weight: 400;
        }
        .forget-link-container svg {
            width: 16px;
            height: 16px;
            stroke: #ccc;
            fill: none;
        }
        .forget-link-container:hover span, .forget-link-container:hover svg {
            color: #fff;
            stroke: #fff;
        }

        /* 容器渐变切换动画 */
        .fade-form {
            width: 100%;
            animation: fadeIn 0.4s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- Toast Notifications Container -->
    <div id="toast-container"></div>

    <div class="network-bg"></div>

    <div class="mobile-container">
        <!-- 画面内部顶部的局部光球效果 -->
        <div class="planet-orb"></div>
        <div class="planet-glow"></div>

        <!-- Logo 已移除，仅保留文字标题 -->

        <div class="title">mBai<span>Ai</span></div>

        <!-- Segmented Control (线框+翠绿选中态) -->
        <div class="segmented-control">
            <div class="segment-indicator"></div>
            <div class="segment-btn active" id="tab-login" onclick="switchTab('login')">Login</div>
            <div class="segment-btn" id="tab-register" onclick="switchTab('register')">Register</div>
        </div>

        <!-- =========== 登录表单 =========== -->
        <div id="login-form" class="fade-form">
            <!-- 账号输入框 -->
            <div class="input-group">
                <svg class="icon-left icon-fill" viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                <input type="text" id="login-username" class="glass-input" placeholder="用户名/邮箱">
            </div>

            <!-- 密码输入框 -->
            <div class="input-group">
                <svg class="icon-left icon-stroke" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <input type="password" id="login-password" class="glass-input" placeholder="密码">
                <svg class="icon-right" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
            </div>

            <button id="login-submit-btn" class="login-btn">登 录</button>

            <div class="forget-link-container" id="goto-forget">
                <span>忘记密码</span>
                <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                    <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
            </div>
        </div>

        <!-- =========== 注册表单 =========== -->
        <div id="register-form" class="fade-form" style="display: none;">
            <!-- 1. 邮箱 -->
            <div class="input-group">
                <svg class="icon-left icon-stroke" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2" ry="2"/>
                    <path d="M2 4l10 7 10-7"/>
                </svg>
                <input type="email" id="reg-email" class="glass-input" placeholder="输入邮箱地址">
            </div>

            <!-- 2. 验证码 -->
            <div class="input-group">
                <svg class="icon-left icon-stroke" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                <input type="text" id="reg-code" class="glass-input" placeholder="输入验证码" style="padding-right: 110px;">
                <button id="send-code-btn" class="send-code-btn">获取验证码</button>
            </div>

            <!-- 3. 用户名 -->
            <div class="input-group">
                <svg class="icon-left icon-fill" viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                <input type="text" id="reg-username" class="glass-input" placeholder="设置用户名">
            </div>

            <!-- 4. 密码 -->
            <div class="input-group">
                <svg class="icon-left icon-stroke" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <input type="password" id="reg-password" class="glass-input" placeholder="设置密码">
                <svg class="icon-right" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
            </div>

            <button id="reg-submit-btn" class="login-btn">注 册</button>
        </div>

        <!-- =========== 找回密码表单 =========== -->
        <div id="forget-form" class="fade-form" style="display: none;">
            <!-- 1. 邮箱 -->
            <div class="input-group">
                <svg class="icon-left icon-stroke" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2" ry="2"/>
                    <path d="M2 4l10 7 10-7"/>
                </svg>
                <input type="email" id="forget-email" class="glass-input" placeholder="输入注册邮箱">
            </div>

            <!-- 2. 验证码 -->
            <div class="input-group">
                <svg class="icon-left icon-stroke" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                <input type="text" id="forget-code" class="glass-input" placeholder="输入验证码" style="padding-right: 110px;">
                <button id="forget-send-code-btn" class="send-code-btn">获取验证码</button>
            </div>

            <!-- 3. 新密码 -->
            <div class="input-group">
                <svg class="icon-left icon-stroke" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <input type="password" id="forget-password" class="glass-input" placeholder="设置新密码">
                <svg class="icon-right" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
            </div>

            <button id="forget-submit-btn" class="login-btn">重 置 密 码</button>

            <!-- 返回登录 -->
            <div class="forget-link-container" id="back-to-login">
                <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                <span>返回登录</span>
            </div>
        </div>

    </div>

    <script>
        // 切换 Login / Register 交互逻辑
        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            const indicator = document.querySelector('.segment-indicator');
            const btnLogin = document.getElementById('tab-login');
            const btnReg = document.getElementById('tab-register');

            if(tab === 'login') {
                btnLogin.classList.add('active');
                btnReg.classList.remove('active');
                indicator.style.left = '4px';

                // 重新触发动画
                loginForm.style.display = 'block';
                regForm.style.display = 'none';
                document.getElementById('forget-form').style.display = 'none';
            } else {
                btnReg.classList.add('active');
                btnLogin.classList.remove('active');
                indicator.style.left = 'calc(50% - 2px)';

                // 重新触发动画
                loginForm.style.display = 'none';
                regForm.style.display = 'block';
                document.getElementById('forget-form').style.display = 'none';
            }
        }

        // 忘记密码界面切换
        document.getElementById('goto-forget').addEventListener('click', () => {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('register-form').style.display = 'none';
            document.getElementById('forget-form').style.display = 'block';
            document.querySelector('.segmented-control').style.display = 'none';
        });

        document.getElementById('back-to-login').addEventListener('click', () => {
            document.getElementById('forget-form').style.display = 'none';
            document.querySelector('.segmented-control').style.display = 'flex';
            switchTab('login');
        });

        // --- API & UI Logic ---

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'error'
                ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`
                : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`;
            toast.innerHTML = icon + `<span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.3s ease forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        const SERVER_UNREACHABLE_MESSAGE = '暂时无法连接服务器';
        const SERVER_RESPONSE_ERROR_MESSAGE = '服务响应异常';

        function classifiedError(message, category) {
            const error = new Error(message);
            error.category = category;
            return error;
        }

        async function apiCall(endpoint, payload) {
            try {
                let response;
                try {
                    response = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } catch (_) {
                    throw classifiedError(SERVER_UNREACHABLE_MESSAGE, 'network');
                }
                let data;
                try {
                    const responseText = await response.text();
                    data = responseText ? JSON.parse(responseText) : {};
                } catch (_) {
                    throw classifiedError(SERVER_RESPONSE_ERROR_MESSAGE, 'response');
                }
                if (!response.ok) {
                    throw new Error(data.detail || '请求失败');
                }
                return data;
            } catch (err) {
                const message = err && err.message ? err.message : '请求失败';
                showToast(message, 'error');
                throw new Error(message);
            }
        }

        // Login Logic
        document.getElementById('login-submit-btn').addEventListener('click', async () => {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            if(!username || !password) return showToast('请输入账号和密码', 'error');

            const btn = document.getElementById('login-submit-btn');
            btn.innerText = '登录中...';
            btn.disabled = true;
            try {
                await apiCall('/api/account/login', { username, password });
                showToast('登录成功，正在跳转...');
                setTimeout(() => window.location.href = '/', 500);
            } catch(e) {
                btn.innerText = '登 录';
                btn.disabled = false;
            }
        });

        // Send Email Code
        document.getElementById('send-code-btn').addEventListener('click', async () => {
            const email = document.getElementById('reg-email').value;
            if(!email) return showToast('请输入邮箱地址', 'error');

            const btn = document.getElementById('send-code-btn');
            btn.innerText = '发送中...';
            btn.disabled = true;

            try {
                await apiCall('/api/account/request-email-code', { email, intent: 'register' });
                showToast('验证码已发送');
                let timer = 60;
                btn.style.borderColor = 'rgba(255,255,255,0.2)';
                btn.style.color = 'rgba(255,255,255,0.5)';
                const interval = setInterval(() => {
                    timer--;
                    if(timer <= 0) {
                        clearInterval(interval);
                        btn.innerText = '获取验证码';
                        btn.disabled = false;
                        btn.style.borderColor = '';
                        btn.style.color = '';
                    } else {
                        btn.innerText = `${timer}s 后重发`;
                    }
                }, 1000);
            } catch(e) {
                btn.innerText = '获取验证码';
                btn.disabled = false;
            }
        });

        // Register Logic
        document.getElementById('reg-submit-btn').addEventListener('click', async () => {
            const email = document.getElementById('reg-email').value;
            const verification_code = document.getElementById('reg-code').value;
            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;

            if(!email || !verification_code || !username || !password) {
                return showToast('请填写完整信息', 'error');
            }

            const btn = document.getElementById('reg-submit-btn');
            btn.innerText = '注册中...';
            btn.disabled = true;

            try {
                await apiCall('/api/account/register', { email, verification_code, username, password });
                showToast('注册成功，正在跳转...');
                setTimeout(() => window.location.href = '/', 500);
            } catch(e) {
                btn.innerText = '注 册';
                btn.disabled = false;
            }
        });

        // Forget Send Email Code
        document.getElementById('forget-send-code-btn').addEventListener('click', async () => {
            const email = document.getElementById('forget-email').value;
            if(!email) return showToast('请输入邮箱地址', 'error');

            const btn = document.getElementById('forget-send-code-btn');
            btn.innerText = '发送中...';
            btn.disabled = true;

            try {
                await apiCall('/api/account/request-email-code', { email, intent: 'reset' });
                showToast('验证码已发送');
                let timer = 60;
                btn.style.borderColor = 'rgba(255,255,255,0.2)';
                btn.style.color = 'rgba(255,255,255,0.5)';
                const interval = setInterval(() => {
                    timer--;
                    if(timer <= 0) {
                        clearInterval(interval);
                        btn.innerText = '获取验证码';
                        btn.disabled = false;
                        btn.style.borderColor = '';
                        btn.style.color = '';
                    } else {
                        btn.innerText = `${timer}s 后重发`;
                    }
                }, 1000);
            } catch(e) {
                btn.innerText = '获取验证码';
                btn.disabled = false;
            }
        });

        // Forget Password Logic
        document.getElementById('forget-submit-btn').addEventListener('click', async () => {
            const email = document.getElementById('forget-email').value;
            const verification_code = document.getElementById('forget-code').value;
            const new_password = document.getElementById('forget-password').value;

            if(!email || !verification_code || !new_password) {
                return showToast('请填写完整信息', 'error');
            }

            const btn = document.getElementById('forget-submit-btn');
            btn.innerText = '重置中...';
            btn.disabled = true;

            try {
                await apiCall('/api/account/reset-password', { email, verification_code, new_password });
                showToast('密码重置成功，请重新登录！');
                setTimeout(() => {
                    document.getElementById('back-to-login').click();
                    document.getElementById('login-username').value = email;
                    document.getElementById('login-password').value = '';
                    btn.innerText = '重 置 密 码';
                    btn.disabled = false;
                }, 1000);
            } catch(e) {
                btn.innerText = '重 置 密 码';
                btn.disabled = false;
            }
        });

        // Password Visibility Toggle
        document.querySelectorAll('.icon-right').forEach(icon => {
            icon.addEventListener('click', function() {
                const input = this.previousElementSibling;
                if(input.type === 'password') {
                    input.type = 'text';
                    this.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
                } else {
                    input.type = 'password';
                    this.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;
                }
            });
        });

    </script>
</body>
</html>
